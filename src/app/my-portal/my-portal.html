<div class="container">
  <div class="row">
    <div class="col-md-12">
      <div *ngFor="let section of layout">
        <h5 class="mt-3">{{ section.name }}</h5>

        <div class="row">
          <ng-container *ngFor="let field of section.fields">
            <div *ngIf="shouldShowField(field)" [ngClass]="'col-md-' + (field.colSize || 12)" class="mb-2">
              <!-- <label>{{ field.label }}</label> -->

              <label>
                {{ field.label }}
                <span *ngIf="field.required" class="text-danger">*</span>
              </label>

              <!-- TEXT -->
              <input
                *ngIf="field.type == 'text'"
                class="form-control"
                [(ngModel)]="formData[field.id]"
              />

              <!-- DATE -->
              <input
                *ngIf="field.type == 'date'"
                type="date"
                class="form-control"
                [(ngModel)]="formData[field.id]"
              />

              <!-- NUMBER -->
              <input
                *ngIf="field.type == 'number'"
                type="number"
                class="form-control"
                [(ngModel)]="formData[field.id]"
              />

              <!-- TEXTAREA -->
              <textarea
                *ngIf="field.type == 'textarea'"
                class="form-control"
                [(ngModel)]="formData[field.id]"
              ></textarea>

              <!-- DROPDOWN -->
              <select
                *ngIf="field.type == 'dropdown'"
                class="form-control"
                [(ngModel)]="formData[field.id]"
              >
                <option *ngFor="let opt of field.options">{{ opt }}</option>
              </select>

              <!-- CHECKBOX -->
              <input
                *ngIf="field.type == 'checkbox'"
                type="checkbox"
                [(ngModel)]="formData[field.id]"
                class="ms-2"
              />

              <!-- RADIO -->
              <div *ngIf="field.type == 'radio'">
                <div *ngFor="let opt of field.options">
                  <input type="radio" [value]="opt" [(ngModel)]="formData[field.id]" /> {{ opt }}
                </div>
              </div>

              <!-- CHECKBOX LIST -->
              <div *ngIf="field.type == 'checkboxList'">
                <div *ngFor="let opt of field.options">
                  <input type="checkbox" (change)="onCheckboxChange(field.id, opt, $event)" />
                  {{ opt }}
                </div>
              </div>

              <!-- IMAGE -->
              <input
                #fileInput
                *ngIf="field.type == 'image'"
                type="file"
                class="form-control"
                (change)="onFileChange($event, field.id)"
                [attr.data-field-id]="field.id"
                (click)="fileInputs[field.id] = fileInput"
              />

              <div *ngIf="field.type == 'imge'">
                <input
                  type="file"
                  class="form-control"
                  multiple
                  (change)="onMultipleFileChange($event, field.id)"
                />

                <div class="d-flex gap-2 mt-2">
                  <div *ngFor="let img of formData[field.id]; let i = index">
                    <img [src]="img" width="100" class="border" />

                    <button class="btn btn-sm btn-danger" (click)="deleteImage(field.id, i, img)">
                      ❌
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
      <div class="mt-3">
        <button class="btn btn-primary" (click)="submitForm()">Submit Form</button>
      </div>
    </div>
  </div>
</div>
